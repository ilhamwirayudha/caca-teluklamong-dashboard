<div id="caca-hybrid-loader" class="caca-hybrid-card {{ done_class }}">
<div class="caca-hybrid-header">
<div id="hybrid-status-text" class="caca-hybrid-status">{{ status_text }}</div>
<div id="hybrid-close-btn" class="caca-hybrid-close" onclick="var c=document.getElementById('caca-hybrid-loader');if(c){c.style.opacity='0';c.style.transform='scale(0.92)';c.style.transition='all 0.2s ease';setTimeout(function(){c.style.display='none';},200);}" title="Tutup status">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
</div>
</div>
<div class="caca-hybrid-gauge">
<svg width="64" height="64" viewBox="0 0 64 64" style="display: block; width: 64px; height: 64px; overflow: visible;">
<circle class="caca-hybrid-circle-track" cx="32" cy="32" r="26" stroke-width="5" fill="none" />
<circle id="hybrid-circle-progress" class="caca-hybrid-circle-arc" cx="32" cy="32" r="26" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="163.36" stroke-dashoffset="{{ stroke_dashoffset }}" transform="rotate(-90 32 32)" />
</svg>
<div id="hybrid-pct-text" class="caca-hybrid-pct">{{ pct }}%</div>
</div>
<div class="caca-hybrid-info">
<div class="caca-hybrid-fname" title="{{ filename }}">{{ filename }}</div>
<div class="caca-hybrid-detail" title="{{ detail_text }}">{{ detail_text }}</div>
</div>
<div class="caca-hybrid-bar-track">
<svg width="100%" height="4" style="display: block; width: 100%; height: 4px;">
<rect class="caca-hybrid-bar-rect" height="4" width="{{ pct }}%" rx="2" ry="2" />
</svg>
</div>
</div>
