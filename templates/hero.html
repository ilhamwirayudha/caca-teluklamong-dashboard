<div class="artistic-hero" style="{{ bg_style }}">
    <div class="hero-scrim"></div>

    <div class="hero-content">
        <!-- TOP HEADER: CENTERED ENLARGED LOGOS ONLY (FROSTED GLASS WHITISH-GRAY CAPSULES) -->
        <div class="hero-header-nav">
            <div class="hero-center-brand-group">
                <div class="hero-logo-item" title="CACA - Cycle Analyst &amp; Cargo Accelaration">
                    {{ caca_logo_html }}
                </div>
                <div class="hero-logo-item" title="Pelindo Terminal Teluk Lamong">
                    {{ pelindo_logo_html }}
                </div>
            </div>
        </div>

        <!-- CENTER BODY: CACA MAIN TITLE & SUB TITLE HIERARCHY -->

            <!-- 1. Main Title: CACA (Largest Monumental Heading) -->

            <div class="hero-action-group">

                    <span>Mulai Analisis</span>
                    <span class="hero-btn-icon-circle">↓</span>

            </div>
        </div>
